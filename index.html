<style>
*{box-sizing:border-box}
:root{
 --bg:#050b16;
 --panel:#0d1729;
 --panel2:#111e33;
 --text:#f4f7ff;
 --muted:#8d9bb3;
 --accent:#4285f4;
 --user:#1c355b;
 --border:#263752;
 --danger:#ff6675;

}
html,body{
 margin:0;width:100%;height:100%;
 background:var(--bg);color:var(--text);
 font-family:Arial,sans-serif;
 overflow:hidden;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{

}
.topbar{

}
.menuBtn,.iconBtn{

 display:flex;align-items:center;justify-content:center;
}
.brand{flex:1;min-width:0}
.brand b{

}
.status{
 font-size:13px;color:var(--muted);
 margin-top:3px;
}
.status i{
 display:inline-block;width:7px;height:7px;
 border-radius:50%;background:var(--success);

}
.chat{

 padding:20px 14px 125px;

}
.empty{

 text-align:center;padding:20px;
}
.empty h1{font-size:30px;margin:0 0 10px}
.empty p{font-size:17px;color:var(--muted);line-height:1.6}
.msg{
 display:flex;gap:10px;
 margin:18px 0;
}
.msg.user{justify-content:flex-end}
.avatar{
 width:42px;height:42px;flex:0 0 42px;
 border-radius:14px;
 background:var(--panel2);
 border:1px solid var(--border);
 display:flex;align-items:center;
 justify-content:center;
 font-weight:bold;
}
.msg.user .avatar{

}
.bubbleWrap{max-width:82%}
.name{
 font-size:12px;color:var(--muted);
 margin:0 0 6px 2px;
}
.msg.user .name{text-align:right}
.bubble{
 padding:15px 17px;
 border-radius:18px;
 background:var(--panel);
 border:1px solid rgba(255,255,255,.04);
 font-size:17px;
 line-height:1.65;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.msg.user .bubble{
 background:var(--user);
}
.actions{
 display:flex;gap:7px;
 margin-top:7px;
}
.smallBtn{
 border:1px solid var(--border);
 background:transparent;color:var(--muted);
 border-radius:9px;padding:6px 10px;
 font-size:12px;
}
.smallBtn:active{transform:scale(.96)}
.composer{
 position:fixed;left:0;right:0;bottom:0;
 padding:10px 14px 14px;
 background:linear-gradient(transparent,var(--bg) 18%);
}
.composerBox{
 max-width:900px;margin:auto;
 min-height:64px;
 display:flex;align-items:center;gap:8px;
 padding:8px;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:22px;
 box-shadow:0 8px 35px rgba(0,0,0,.35);
}
.plus{
 width:48px;height:48px;flex-shrink:0;
 border:0;border-radius:15px;
 background:var(--panel2);color:var(--text);
 font-size:29px;
}
#message{
 flex:1;min-width:0;
 border:0;outline:0;
 resize:none;
 background:transparent;color:var(--text);
 font-size:17px;
 line-height:1.4;
 padding:10px 5px;
 max-height:130px;
}
#message::placeholder{color:var(--muted)}
.mic{
 width:46px;height:46px;flex-shrink:0;
 border:0;border-radius:15px;
 background:transparent;color:#62d8ff;
 font-size:25px;
}
.mic.active{
 background:#273d62;
 color:#fff;
}
.send{
 width:52px;height:52px;flex-shrink:0;
 border:0;border-radius:16px;
 background:var(--accent);color:white;
 font-size:25px;
}
.send:disabled{opacity:.45}
.footer{
 text-align:center;color:var(--muted);
 font-size:10px;padding:7px 0 0;
}
.hidden{display:none!important}
.typing{
 display:inline-flex;gap:5px;
 padding:5px 0;
}
.typing span{
 width:7px;height:7px;border-radius:50%;
 background:var(--muted);
 animation:blink 1s infinite;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{
 0%,100%{opacity:.25}
 50%{opacity:1}
}
@media(min-width:700px){
 .topbar{padding-left:24px;padding-right:24px}
 .chat{padding-left:7%;padding-right:7%}
 .bubble{font-size:18px}
}

<script>
(function(){

"use strict";

/* ==============================
   SMATER CHAT AI — CORE
============================== */

const $ = id => document.getElementById(id);

const STORAGE_KEY = "SMATER_CHAT_AI_DATA_V1";
const SETTINGS_KEY = "SMATER_CHAT_AI_SETTINGS_V1";

let appData = {
 chats: [],
 currentChat: null
};

let settings = {
 theme: "dark",
 fontSize: 17,
 enterToSend: true
};

let isSending = false;
let selectedFile = null;
let selectedImage = null;


/* ==============================
   STORAGE
============================== */

function saveData(){

 try{
   localStorage.setItem(
     STORAGE_KEY,
     JSON.stringify(appData)
   );

 }catch(error){
   console.log("Storage error:",error);
 }

}

function loadData(){

 try{

   const saved =
     localStorage.getItem(STORAGE_KEY);

   if(saved){
     const data = JSON.parse(saved);

     if(data && typeof data === "object"){
       appData = data;
     }
   }

 }catch(error){

   console.log("Load error:",error);

 }

 if(!Array.isArray(appData.chats)){
   appData.chats = [];
 }

 if(!appData.currentChat){

   appData.currentChat = {
     id: createID(),
     title: "New Chat",
     messages: [],
     createdAt: Date.now(),
     updatedAt: Date.now()
   };

 }

}

function saveSettings(){

 try{

   localStorage.setItem(
     SETTINGS_KEY,
     JSON.stringify(settings)
   );

 }catch(error){

   console.log("Settings error:",error);

 }

}

function loadSettings(){

 try{

   const saved =
     localStorage.getItem(SETTINGS_KEY);

   if(saved){

     const data = JSON.parse(saved);

     if(data && typeof data === "object"){
       settings = {
         ...settings,
         ...data
       };
     }

   }

 }catch(error){

   console.log("Settings load error:",error);

 }

}


/* ==============================
   ID
============================== */

function createID(){

 return Date.now().toString(36) +
        Math.random().toString(36).slice(2);

}


/* ==============================
   HTML SAFETY
============================== */

function escapeHTML(text){

 return String(text)
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")
   .replace(/>/g,"&gt;")
   .replace(/"/g,"&quot;")
   .replace(/'/g,"&#039;");

}


/* ==============================
   CHAT TITLE
============================== */

function updateChatTitle(text){

 if(
   !appData.currentChat ||
   appData.currentChat.title !== "New Chat"
 ){
   return;
 }

 let title =
   String(text)
   .replace(/\s+/g," ")
   .trim();

 if(!title){
   return;
 }

 if(title.length > 38){
   title = title.slice(0,38) + "...";
 }

 appData.currentChat.title = title;

}


/* ==============================
   ADD MESSAGE
============================== */

function addMessage(role,text){

 if(!appData.currentChat){
   createNewChat(false);
 }

 const message = {

   id:createID(),

   role:role,

   content:String(text),

   time:Date.now()

 };

 appData.currentChat.messages.push(message);

 appData.currentChat.updatedAt =
   Date.now();

 if(role === "user"){
   updateChatTitle(text);
 }

 saveData();

 renderMessages();

 return message;

}


/* ==============================
   RENDER MESSAGES
============================== */

function renderMessages(){

 const chat = $("chat");

 if(!chat){
   return;
 }

 const messages =
   appData.currentChat?.messages || [];

 chat.innerHTML = "";

 if(messages.length === 0){

   chat.innerHTML = `
     <div class="empty" id="emptyState">
       <h1>How can I help?</h1>
       <p>
         Ask anything in Hindi, English,
         Hinglish or another language.
       </p>
     </div>
   `;

   return;

 }

 messages.forEach(message => {

   const row =
     document.createElement("div");

   row.className =
     "msg " +
     (message.role === "user"
       ? "user"
       : "");

   const avatar =
     document.createElement("div");

   avatar.className = "avatar";

   avatar.textContent =
     message.role === "user"
       ? "YOU"
       : "S";

   const wrap =
     document.createElement("div");

   wrap.className = "bubbleWrap";

   const name =
     document.createElement("div");

   name.className = "name";

   name.textContent =
     message.role === "user"
       ? "You"
       : "SMATER CHAT AI";

   const bubble =
     document.createElement("div");

   bubble.className = "bubble";

   bubble.textContent =
     message.content;

   wrap.appendChild(name);
   wrap.appendChild(bubble);

   if(message.role === "assistant"){

     const actions =
       document.createElement("div");

     actions.className = "actions";

     const copy =
       document.createElement("button");

     copy.className = "smallBtn";
     copy.textContent = "Copy";

     copy.onclick = () => {

       copyText(message.content);

       copy.textContent = "Copied ✓";

       setTimeout(() => {
         copy.textContent = "Copy";
       },1500);

     };

     actions.appendChild(copy);

     const speak =
       document.createElement("button");

     speak.className = "smallBtn";
     speak.textContent = "🔊 Read";

     speak.onclick = () => {

       if("speechSynthesis" in window){

         speechSynthesis.cancel();

         const voice =
           new SpeechSynthesisUtterance(
             message.content
           );

         speechSynthesis.speak(voice);

       }

     };

     actions.appendChild(speak);

     wrap.appendChild(actions);

   }

   row.appendChild(avatar);
   row.appendChild(wrap);

   chat.appendChild(row);

 });

 scrollChat();

}


/* ==============================
   COPY
============================== */

async function copyText(text){

 try{

   await navigator.clipboard.writeText(text);

 }catch(error){

   const area =
     document.createElement("textarea");

   area.value = text;

   document.body.appendChild(area);

   area.select();

   document.execCommand("copy");

   area.remove();

 }

}


/* ==============================
   SCROLL
============================== */

function scrollChat(){

 const chat = $("chat");

 if(!chat) return;

 setTimeout(() => {

   chat.scrollTop =
     chat.scrollHeight;

 },30);

}


/* ==============================
   TYPING
============================== */

function showTyping(){

 const chat = $("chat");

 if(!chat) return;

 const row =
   document.createElement("div");

 row.className =
   "msg";

 row.id =
   "typingMessage";

 row.innerHTML = `
   <div class="avatar">S</div>

   <div class="bubbleWrap">

     <div class="name">
       SMATER CHAT AI
     </div>

     <div class="bubble">

       <span class="typing">
         <span></span>
         <span></span>
         <span></span>
       </span>

     </div>

   </div>
 `;

 chat.appendChild(row);

 scrollChat();

}


function hideTyping(){

 const typing =
   $("typingMessage");

 if(typing){
   typing.remove();
 }

}


/* ==============================
   STATUS
============================== */

function setStatus(text){

 const status =
   $("statusText");

 if(status){
     status.textContent = text;
 }

}


/* ==============================
   INPUT
============================== */

function resizeInput(){

 const input =
   $("message");

 if(!input){
   return;
 }

 input.style.height =
   "auto";

 input.style.height =
   Math.min(
     input.scrollHeight,
     130
   ) + "px";

}


/* ==============================
   SEND TO AI
============================== */

async function sendMessage(){

 if(isSending){
   return;
 }

 const input =
   $("message");

 if(!input){
   return;
 }

 const text =
   input.value.trim();

 if(!text && !selectedFile){
   return;
 }

 isSending = true;

 $("sendBtn").disabled = true;

 setStatus("Thinking…");

 let finalText = text;

 if(selectedFile){

   finalText +=
     "\n\n[Attached file: " +
     selectedFile.name +
     "]";

 }

 addMessage(
   "user",
   finalText
 );

 input.value = "";

 resizeInput();

 showTyping();

 try{

   const history =
     appData.currentChat.messages
       .slice(0,-1)
       .map(message => ({
         role:
           message.role,
         content:
           message.content
       }));

   history.push({
     role:"user",
     content:finalText
   });


   const body = {
     messages:history
   };


   if(selectedImage){

     body.image =
       selectedImage;

   }


   const response =
     await fetch(
       "/api/chat",
       {
         method:"POST",

         headers:{
           "Content-Type":
             "application/json"
         },

         body:
           JSON.stringify(body)
       }
     );


   let result = {};

   try{

     result =
       await response.json();

   }catch(error){

     result = {};

   }


   if(!response.ok){

     throw new Error(
       result.error ||
       "AI request failed."
     );

   }


   if(
     !result.text ||
     !String(result.text).trim()
   ){

     throw new Error(
       "AI returned an empty response."
     );

   }


   hideTyping();

   addMessage(
     "assistant",
     result.text
   );


 }catch(error){

   hideTyping();

   addMessage(
     "assistant",
     "Sorry, I couldn't complete that request. " +
     error.message
   );

 }finally{

   selectedFile = null;
   selectedImage = null;

   $("sendBtn").disabled =
     false;

   setStatus("AI ready");

 }

}


/* ==============================
   NEW CHAT
============================== */

function createNewChat(saveOld=true){

 if(
   saveOld &&
   appData.currentChat &&
   appData.currentChat.messages.length
 ){

   const old =
     JSON.parse(
       JSON.stringify(
         appData.currentChat
       )
     );

   appData.chats =
     appData.chats.filter(
       chat =>
         chat.id !== old.id
     );

   appData.chats.unshift(old);

   if(appData.chats.length > 50){
     appData.chats =
       appData.chats.slice(0,50);
   }

 }

 appData.currentChat = {

   id:createID(),

   title:"New Chat",

   messages:[],

   createdAt:Date.now(),

   updatedAt:Date.now()

 };

 saveData();

 renderMessages();

 selectedFile = null;
 selectedImage = null;

 setStatus("AI ready");

}


/* ==============================
   EVENTS
============================== */

$("sendBtn").addEventListener(
 "click",
 sendMessage
);

$("newChatBtn").addEventListener(
 "click",
 () => createNewChat(true)
);

$("message").addEventListener(
 "input",
 resizeInput
);

$("message").addEventListener(
 "keydown",
 function(event){

   if(
     event.key === "Enter" &&
     !event.shiftKey &&
     settings.enterToSend
   ){

     event.preventDefault();

     sendMessage();

   }

 }
);


/* ==============================
   START
============================== */

loadData();

loadSettings();

renderMessages();

resizeInput();

})();
</script>

  <script>
/* ==============================
   PART 4 — ATTACHMENTS + MENU
============================== */

const attachMenu =
  document.getElementById("attachMenu");

const drawer =
  document.getElementById("drawer");

const overlay =
  document.getElementById("overlay");

const modal =
  document.getElementById("modal");


/* ==============================
   ATTACHMENT MENU
============================== */

document
  .getElementById("plusBtn")
  .addEventListener("click", function(){

    attachMenu.classList.toggle("hidden");

  });


function closeAttachMenu(){

  attachMenu.classList.add("hidden");

}


/* ==============================
   FILE HANDLING
============================== */

function handleFile(file){

  if(!file){
    return;
  }

  selectedFile = file;

  const reader =
    new FileReader();

  if(file.type.startsWith("image/")){

    reader.onload = function(){

      selectedImage =
        reader.result;

    };

    reader.readAsDataURL(file);

  }

  setStatus(
    "File attached: " + file.name
  );

  closeAttachMenu();

}


/* ==============================
   GALLERY
============================== */

document
  .getElementById("galleryBtn")
  .addEventListener("click", function(){

    document
      .getElementById("galleryInput")
      .click();

  });


document
  .getElementById("galleryInput")
  .addEventListener("change", function(){

    handleFile(this.files[0]);

    this.value = "";

  });


/* ==============================
   CAMERA
============================== */

document
  .getElementById("cameraBtn")
  .addEventListener("click", function(){

    document
      .getElementById("cameraInput")
      .click();

  });


document
  .getElementById("cameraInput")
  .addEventListener("change", function(){

    handleFile(this.files[0]);

    this.value = "";

<script>
/* ==============================
   HISTORY
============================== */

document
  .getElementById("historyBtn")
  .addEventListener("click", showHistory);


/* ==============================
   SHOW HISTORY
============================== */

function showHistory(){

  closeDrawer();

  const chats =
    Array.isArray(appData.chats)
      ? appData.chats
      : [];

  let html = "";

  if(chats.length === 0){

    html = `
      <div class="emptyHistory">
        <div class="historyIcon">🕘</div>
        <h3>No previous chats</h3>
        <p>Your saved conversations will appear here.</p>
      </div>
    `;

  }else{

    chats.forEach(function(chat,index){

      const title =
        escapeHTML(
          chat.title || "New Chat"
        );

      const count =
        Array.isArray(chat.messages)
          ? chat.messages.length
          : 0;

      html += `
        <div class="historyCard">

          <button
            class="historyOpen"
            data-history-index="${index}"
          >

            <div class="historyTitle">
              ${title}
            </div>

            <div class="historyInfo">
              ${count} message${count === 1 ? "" : "s"}
            </div>

          </button>

          <button
            class="historyDelete"
            data-history-delete="${index}"
            aria-label="Delete chat"
          >
            🗑️
          </button>

        </div>
      `;

    });

  }


  showModal(
    "Chat History",
    `
      <div class="historyList">
        ${html}
      </div>

      <button
        class="historyNew"
        id="historyNewChat"
      >
        ＋ Start New Chat
      </button>
    `
  );


  document
    .querySelectorAll("[data-history-index]")
    .forEach(function(button){

      button.addEventListener(
        "click",
        function(){

          const index =
            Number(
              this.dataset.historyIndex
            );

          openHistoryChat(index);

        }
      );

    });


  document
    .querySelectorAll("[data-history-delete]")
    .forEach(function(button){

      button.addEventListener(
        "click",
        function(event){

          event.stopPropagation();

          const index =
            Number(
              this.dataset.historyDelete
            );

          deleteHistoryChat(index);

        }
      );

    });


  const newButton =
    document.getElementById(
      "historyNewChat"
    );

  if(newButton){

    newButton.addEventListener(
      "click",
      function(){

        closeModal();

        createNewChat(true);

      }
    );

  }

}


/* ==============================
   OPEN OLD CHAT
============================== */

function openHistoryChat(index){

  const chats =
    Array.isArray(appData.chats)
      ? appData.chats
      : [];

  if(
    index < 0 ||
    index >= chats.length
  ){
    return;
  }


  /*
   * Save the currently active chat
   * before switching.
   */

  if(
    appData.currentChat &&
    appData.currentChat.messages.length
  ){

    const current =
      JSON.parse(
        JSON.stringify(
          appData.currentChat
        )
      );

    const existingIndex =
      appData.chats.findIndex(
        chat =>
          chat.id === current.id
      );

    if(existingIndex >= 0){

      appData.chats[
        existingIndex
      ] = current;

    }else{

      appData.chats.unshift(
        current
      );

    }

  }


  /*
   * Restore selected conversation.
   */

  appData.currentChat =
    JSON.parse(
      JSON.stringify(
        chats[index]
      )
    );


  /*
   * Remove restored chat from
   * history list so it becomes
   * the active conversation.
   */

  appData.chats =
    appData.chats.filter(
      chat =>
        chat.id !==
        appData.currentChat.id
    );


  saveData();

  renderMessages();

  closeModal();

  setStatus("AI ready");

}


/* ==============================
   DELETE HISTORY
============================== */

function deleteHistoryChat(index){

  if(!confirm(
    "Delete this conversation from history?"
  )){
    return;
  }


  appData.chats.splice(
    index,
    1
  );


  saveData();

  showHistory();

}

  font.value = String(settings.fontSize);
  enter.checked = settings.enterToSend;


  theme.onchange = function(){

    settings.theme = this.value;

    applyTheme();

    saveSettings();

  };


  font.onchange = function(){

    settings.fontSize =
      Number(this.value);

    applyFontSize();

    saveSettings();

  };


  enter.onchange = function(){

    settings.enterToSend =
      this.checked;

    saveSettings();

  };

}


/* ==============================
   THEME
============================== */

function applyTheme(){

  let theme =
    settings.theme;

  if(theme === "system"){

    theme =
      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches
        ? "dark"
        : "light";

  }

  if(theme === "light"){

    document.documentElement.style
      .setProperty("--bg","#f5f7fb");

    document.documentElement.style
      .setProperty("--panel","#ffffff");

    document.documentElement.style
      .setProperty("--panel2","#edf1f7");

    document.documentElement.style
      .setProperty("--text","#172033");

    document.documentElement.style
      .setProperty("--muted","#68758a");

      .setProperty("--border","#d8dfeb");

      .setProperty("--user","#dce9ff");

      .setProperty("--bg","#050b16");

    document.documentElement.style
      .setProperty("--border","#263752");

    document.documentElement.style
      .setProperty("--user","#1c355b");

  }

}


function applyFontSize(){

        <button

        >
          ⚠️ Clear All Local Data
        </button>

      </div>
    `
  );


  document.getElementById(

    appData.chats = [];

  document.getElementById(

    )){
      return;
    }

    localStorage.removeItem(
      STORAGE_KEY
    );

    localStorage.removeItem(
      SETTINGS_KEY
    );

    localStorage.removeItem(
      "SMATER_CHAT_AI_ACCOUNT_V1"
    );

    location.reload();

  };

/* ==============================
   EXPORT DATA
============================== */

function exportData(){

  const data = {
    app:"SMATER CHAT AI",
    exportedAt:
      new Date().toISOString(),
    currentChat:
      appData.currentChat,
    savedChats:
      appData.chats
  };


  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    "smater-chat-ai-data.json";

  link.click();

  URL.revokeObjectURL(url);

}


/* ==============================
   SHARE / EXPORT
============================== */

document.getElementById("shareBtn")
.addEventListener(
  "click",
  showShare

function showShare(){

  closeDrawer();

  showModal(

    `
      <div class="shareBox">

          class="dataButton"

        >

/* ==============================
   CHAT TEXT
============================== */

function getCurrentChatText(){

  const messages =
    appData.currentChat?.messages || [];

  return messages.map(function(m){

    return (
      (m.role === "user"
        ? "You"
        : "SMATER CHAT AI") +
      ":\n" +
      m.content
    );

  }).join("\n\n");

}


/* ==============================
   SHARE
============================== */

async function shareCurrentChat(){

  const text =
    getCurrentChatText();

  if(!text){

    alert("There is no chat to share.");

    return;

  }


  if(navigator.share){

    try{

      await navigator.share({
        title:"SMATER CHAT AI",
        text:text
      });

    }catch(error){}

  }else{

    await copyText(text);

    alert(
      "Chat copied. You can paste it anywhere."
    );

  }

}


/* ==============================
   COPY CHAT
============================== */

async function copyCurrentChat(){

  const text =
    getCurrentChatText();

  if(!text){

    alert("There is no chat to copy.");

    return;

  }

  await copyText(text);

  alert("Chat copied successfully.");

}


/* ==============================
   DOWNLOAD CHAT
============================== */

function downloadCurrentChat(){

  const text =
    getCurrentChatText();

  if(!text){

    alert("There is no chat to save.");

    return;

  }


  const blob =
    new Blob(
      [text],
      {type:"text/plain;charset=utf-8"}
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    "smater-chat-ai-chat.txt";

  link.click();

  URL.revokeObjectURL(url);

}

<script>

/* ==============================
   MICROPHONE / VOICE INPUT
============================== */

let recognition = null;
let listening = false;

const micBtn =
  document.getElementById("micBtn");

function setupVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    micBtn.title =
      "Voice input is not supported in this browser";

    return;

  }

  recognition =
    new SpeechRecognition();

  recognition.continuous = false;

  recognition.interimResults = true;

  recognition.lang = "hi-IN";


  recognition.onstart = function(){

    listening = true;

    micBtn.classList.add("active");

    micBtn.textContent = "⏹️";

    setStatus("Listening…");

  };


  recognition.onresult =
    function(event){

      let finalText = "";
      let interimText = "";

      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        const text =
          event.results[i][0].transcript;

        if(event.results[i].isFinal){

          finalText += text;

        }else{

          interimText += text;

        }

      }


      const input =
        document.getElementById("message");


      if(finalText){

        input.value =
          (
            input.value
              ? input.value + " "
              : ""
          ) + finalText;

        resizeInput();

      }

      setStatus(
        interimText
          ? "Listening: " + interimText
          : "Listening…"
      );

    };


  recognition.onerror =
    function(event){

      console.log(
        "Voice error:",
        event.error
      );

      if(
        event.error ===
        "not-allowed"
      ){

        alert(
          "Microphone permission is blocked. " +
          "Allow microphone access in your browser."
        );

      }else if(
        event.error !== "aborted"
      ){

        setStatus(
          "Voice input unavailable"
        );

      }

    };


  recognition.onend =
    function(){

      listening = false;

      micBtn.classList.remove(
        "active"
      );

      micBtn.textContent = "🎙️";

      setStatus("AI ready");

    };

}


micBtn.addEventListener(
  "click",
  function(){

    if(!recognition){

      setupVoice();

    }

    if(!recognition){

      alert(
        "Voice input is not supported in this browser."
      );

      return;

    }


    if(listening){

      recognition.stop();

      return;

    }


    /*
     * Hindi first.
     * Browser can automatically handle
     * many languages, and the user can
     * speak naturally.
     */

    recognition.lang = "hi-IN";

    try{

      recognition.start();

    }catch(error){

      console.log(error);

    }

  }
);

function safeAIText(text){

  if(typeof text !== "string"){
    return "";

}
