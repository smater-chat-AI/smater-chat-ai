<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>SMATER CHAT AI</title>

<style>
*{box-sizing:border-box}

:root{
 --bg:#080d18;
 --panel:#101827;
 --panel2:#172236;
 --text:#f5f7fb;
 --muted:#94a1b5;
 --line:#293852;
 --accent:#6878ff;
 --user:#24436f;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
}

body{
 background:var(--bg);
 color:var(--text);
 font-family:system-ui,
 -apple-system,BlinkMacSystemFont,
 "Segoe UI",sans-serif;
}

button,input,textarea,select{
 font:inherit;
 color:inherit;
}

button{cursor:pointer}

.app{
 width:100%;
 height:100%;
 display:flex;
}

.sidebar{
 width:270px;
 background:var(--panel);
 border-right:1px solid var(--line);
 padding:14px;
 display:flex;
 flex-direction:column;
 gap:8px;
}

.brand{
 padding:8px 5px 16px;
}

.brand b{
 font-size:18px;
}

.brand small{
 display:block;
 color:var(--muted);
 font-size:11px;
 margin-top:4px;
}

.sideBtn{
 width:100%;
 padding:11px;
 border:1px solid var(--line);
 border-radius:12px;
 background:var(--panel2);
 text-align:left;
}

.newChat{
 background:var(--accent);
 border:0;
 text-align:center;
 font-weight:700;
}

.historyTitle{
 color:var(--muted);
 font-size:11px;
 margin:10px 3px 3px;
}

.history{
 flex:1;
 overflow:auto;
}

.historyItem{
 padding:10px;
 border-radius:10px;
 font-size:13px;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}

.historyItem:hover{
 background:var(--panel2);
}

.main{
 flex:1;
 min-width:0;
 display:flex;
 flex-direction:column;
 position:relative;
}

.topbar{
 height:62px;
 display:flex;
 align-items:center;
 gap:12px;
 padding:0 16px;
 border-bottom:1px solid var(--line);
}

.menuBtn{
 display:none;
 border:0;
 background:transparent;
 font-size:22px;
}

.title{
 font-weight:800;
}

.status{
 color:var(--muted);
 font-size:11px;
 margin-top:3px;
}

.chat{
 flex:1;
 overflow:auto;
}

.chatInner{
 max-width:920px;
 margin:auto;
 padding:30px 16px 160px;
}
 .welcome{
text-align:center;
padding:45px 8px;
}

.logo{
width:58px;
height:58px;
margin:auto;
border-radius:18px;
background:var(--accent);
display:grid;
place-items:center;
font-size:25px;
font-weight:900;
}

.welcome h1{
font-size:29px;
margin:18px 0 8px;
}

.welcome p{
color:var(--muted);
max-width:650px;
margin:auto;
line-height:1.5;
}

.cards{
max-width:680px;
margin:28px auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.card{
border:1px solid var(--line);
background:var(--panel);
border-radius:15px;
padding:15px;
text-align:left;
}

.card:hover{
background:var(--panel2);
}

.card b{
display:block;
margin-bottom:5px;
}

.card small{
color:var(--muted);
line-height:1.4;
}

.message{
display:flex;
gap:10px;
margin:18px 0;
}

.message.user{
justify-content:flex-end;
}

.avatar{
width:36px;
height:36px;
flex:0 0 36px;
border-radius:11px;
background:var(--panel2);
display:grid;
place-items:center;
font-size:11px;
font-weight:800;
}

.user .avatar{
order:2;
background:var(--user);
}

.messageWrap{
max-width:84%;
}

.bubble{
background:var(--panel);
border:1px solid var(--line);
border-radius:15px;
padding:12px 14px;
line-height:1.6;
white-space:pre-wrap;
word-break:break-word;
font-size:16px;
}

.user .bubble{
background:var(--user);
}

.messageActions{
margin-top:5px;
}

.actionBtn{
border:0;
background:transparent;
color:var(--muted);
font-size:11px;
padding:3px 6px;
}
 .composerArea{
position:absolute;
left:0;
right:0;
bottom:0;
padding:10px 12px 12px;
background:linear-gradient(
to top,var(--bg) 70%,transparent);
}

.composer{
max-width:920px;
margin:auto;
display:flex;
align-items:flex-end;
gap:5px;
padding:7px;
background:var(--panel);
border:1px solid var(--line);
border-radius:17px;
position:relative;
}

#input{
flex:1;
min-width:0;
min-height:44px;
max-height:150px;
resize:none;
border:0;
outline:0;
background:transparent;
padding:11px 5px;
font-size:16px;
}

.iconBtn,.sendBtn{
width:42px;
height:42px;
min-width:42px;
border:0;
border-radius:12px;
background:transparent;
display:grid;
place-items:center;
}

.iconBtn:hover{
background:var(--panel2);
}

.sendBtn{
background:var(--accent);
font-size:22px;
font-weight:800;
}

.sendBtn:disabled{
opacity:.45;
cursor:not-allowed;
}

.iconBtn svg,
.tool svg{
width:20px;
height:20px;
fill:none;
stroke:currentColor;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round;
}

.filePreview{
max-width:920px;
margin:0 auto 6px;
padding:8px 10px;
border:1px solid var(--line);
border-radius:11px;
background:var(--panel);
display:none;
justify-content:space-between;
font-size:12px;
}

.filePreview.show{
display:flex;
}

.tools{
position:absolute;
left:4px;
bottom:58px;
width:290px;
background:var(--panel);
border:1px solid var(--line);
border-radius:16px;
padding:7px;
display:none;
grid-template-columns:1fr 1fr;
gap:5px;
box-shadow:0 20px 55px #0008;
}

.tools.show{
display:grid;
}

.tool{
border:0;
background:transparent;
border-radius:11px;
padding:11px 8px;
text-align:left;
}

.tool:hover{
background:var(--panel2);
}

.tool b{
font-size:13px;
}

.tool small{
display:block;
color:var(--muted);
font-size:10px;
margin-top:3px;
}
 .modal{
position:fixed;
inset:0;
background:#0009;
display:none;
place-items:center;
padding:18px;
z-index:100;
}

.modal.show{
display:grid;
}

.modalBox{
width:min(480px,100%);
max-height:88vh;
overflow:auto;
background:var(--panel);
border:1px solid var(--line);
border-radius:18px;
padding:18px;
}

.modalHead{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.closeBtn{
border:0;
background:transparent;
font-size:23px;
}

.option{
background:var(--panel2);
border-radius:12px;
padding:13px;
margin:8px 0;
}

.option small{
display:block;
color:var(--muted);
margin-top:4px;
}

.primary{
width:100%;
border:0;
border-radius:10px;
background:var(--accent);
padding:11px;
font-weight:700;
}

.field{
margin:10px 0;
}

.field label{
display:block;
color:var(--muted);
font-size:12px;
margin-bottom:5px;
}

.field input,
.field select{
width:100%;
padding:10px;
background:var(--panel);
border:1px solid var(--line);
border-radius:9px;
outline:0;
}

@media(max-width:760px){

.sidebar{
position:fixed;
z-index:90;
left:0;
top:0;
bottom:0;
transform:translateX(-105%);
transition:.2s;
}

.sidebar.open{
transform:translateX(0);
}

.menuBtn{
display:block;
}

.cards{
grid-template-columns:1fr;
}

.welcome h1{
font-size:24px;
}

.messageWrap{
max-width:87%;
}

.bubble{
font-size:16px;
}
}
 </style>
</head>

 <script>

const $ = id => document.getElementById(id);

const HISTORY_KEY = "smater_chat_history_v2";

let messages = [];
let file = null;
let sending = false;
let language = "auto";
let mode = "normal";

function saveHistory(){

  try{
    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(messages)
    );
  }catch(e){
    console.warn("History storage unavailable");
  }

}

function loadHistory(){

  try{

    const saved =
      localStorage.getItem(HISTORY_KEY);

    const data =
      saved ? JSON.parse(saved) : [];

    if(Array.isArray(data)){
      messages = data.filter(
        x =>
          x &&
          (x.role === "user" ||
           x.role === "assistant") &&
          typeof x.content === "string"
      );
    }

  }catch(e){

    messages = [];

  }

}

function clearChatScreen(){

  $("chatInner").innerHTML = "";

}

function showWelcome(){

  if($("welcome")) return;

  $("chatInner").innerHTML = `
    <div class="welcome" id="welcome">

      <div class="logo">S</div>

      <h1>How can I help you?</h1>

      <p>
        Ask anything in Hindi, English,
        Hinglish or another language.
      </p>

      <div class="cards">

        <button class="card"
        data-prompt="Explain artificial intelligence in simple words.">
          <b>Learn</b>
          <small>Understand any topic clearly.</small>
        </button>

        <button class="card"
        data-prompt="Help me solve this problem step by step.">
          <b>Solve</b>
          <small>Work through a problem carefully.</small>
        </button>

        <button class="card"
        data-prompt="Give me useful ideas for my project.">
          <b>Ideas</b>
          <small>Brainstorm practical options.</small>
        </button>

        <button class="card"
        data-prompt="Write a professional message for me.">
          <b>Write</b>
          <small>Create clear, polished content.</small>
        </button>

      </div>

    </div>
  `;

  bindPromptButtons();

}

function scrollChat(){

  requestAnimationFrame(() => {

    $("chat").scrollTop =
      $("chat").scrollHeight;

  });

}

function addMessage(role,text,save=true){

  if(!text) return;

  const welcome =
    $("welcome");

  if(welcome){
    welcome.remove();
  }

  const row =
    document.createElement("div");

  row.className =
    "message " + role;

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    role === "user" ? "YOU" : "S";

  const wrap =
    document.createElement("div");

  wrap.className =
    "messageWrap";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent = text;

  wrap.appendChild(bubble);

  if(role === "assistant"){

    const actions =
      document.createElement("div");

    actions.className =
      "messageActions";

    const copy =
      document.createElement("button");

    copy.className =
      "actionBtn";

    copy.textContent =
      "Copy";

    copy.onclick = async () => {

      try{

        await navigator.clipboard
          .writeText(text);

        copy.textContent =
          "Copied";

        setTimeout(
          () => copy.textContent = "Copy",
          1200
        );

      }catch(e){

        copy.textContent =
          "Copy failed";

      }

    };

    actions.appendChild(copy);
    wrap.appendChild(actions);

  }

  row.appendChild(avatar);
  row.appendChild(wrap);

  $("chatInner").appendChild(row);

  if(save){

    messages.push({
      role: role,
      content: text
    });

    saveHistory();

    updateHistory();

  }

  scrollChat();

}

function renderSavedMessages(){

  clearChatScreen();

  if(!messages.length){

    showWelcome();
    return;

  }

  messages.forEach(item => {

    addMessage(
      item.role,
      item.content,
      false
    );

  });

  updateHistory();

}

function updateHistory(){

  const history =
    $("history");

  if(!history) return;

  history.innerHTML = "";

  const users =
    messages.filter(
      x => x.role === "user"
    );

  if(!users.length){

    history.innerHTML =
      `<div class="historyItem">
        No chats yet
      </div>`;

    return;

  }

  users
    .slice()
    .reverse()
    .slice(0,30)
    .forEach((item,index) => {

      const button =
        document.createElement("button");

      button.className =
        "historyItem";

      button.type =
        "button";

      button.textContent =
        item.content.slice(0,70);

      button.onclick = () => {

        renderSavedMessages();

        $("sidebar")
          ?.classList
          .remove("open");

      };

      history.appendChild(button);

    });

}

function bindPromptButtons(){

  document
    .querySelectorAll("[data-prompt]")
    .forEach(button => {

      button.onclick = () => {

        $("input").value =
          button.dataset.prompt;

        $("input").dispatchEvent(
          new Event("input")
        );

        $("input").focus();

      };

    });

}

loadHistory();
renderSavedMessages();

 </script>
 <script>

function updateSendButton(){

  const text =
    $("input").value.trim();

  $("sendBtn").disabled =
    sending ||
    (!text && !file);

}

async function sendMessage(){

  if(sending) return;

  const text =
    $("input").value.trim();

  if(!text && !file) return;

  sending = true;
  updateSendButton();

  $("status").textContent =
    "● Thinking…";

  const userText =
    text ||
    "Please analyze the attached file.";

  addMessage(
    "user",
    file
      ? userText +
        "\n\n[Attached: " +
        file.name +
        "]"
      : userText
  );

  $("input").value = "";

  $("input").style.height =
    "44px";

  let attachment = null;

  try{

    if(file){

      attachment = {
        name: file.name,
        type: file.type,
        data: await readFile(file)
      };

    }

    const loading =
      document.createElement("div");

    loading.className =
      "message assistant";

    loading.innerHTML = `
      <div class="avatar">S</div>
      <div class="messageWrap">
        <div class="bubble">
          Thinking…
        </div>
      </div>
    `;

    $("chatInner")
      .appendChild(loading);

    scrollChat();

    const requestMessages =
      messages.map(x => ({
        role: x.role,
        content: x.content
      }));

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          messages:
            requestMessages,

          language:
            language,

          mode:
            mode,

          file:
            attachment

        })

      });

    let data = {};

    try{

      data =
        await response.json();

    }catch(e){

      data = {};

    }

    loading.remove();

    if(!response.ok){

      throw new Error(
        data.error ||
        "AI request failed."
      );

    }

    const answer =
      typeof data.text === "string"
        ? data.text.trim()
        : "";

    if(!answer){

      throw new Error(
        "AI returned an empty response."
      );

    }

    addMessage(
      "assistant",
      answer
    );

  }catch(error){

    console.error(error);

    addMessage(
      "assistant",
      "Sorry, I couldn't complete that request. Please try again."
    );

  }finally{

    sending = false;

    removeFile();

    $("status").textContent =
      "● AI ready";

    updateSendButton();

    $("input").focus();

  }

}

$("sendBtn").onclick =
  sendMessage;

$("input").addEventListener(
  "input",
  () => {

    $("input").style.height =
      "44px";

    $("input").style.height =
      Math.min(
        $("input").scrollHeight,
        150
      ) + "px";

    updateSendButton();

  }
);

$("input").addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);

 </script>
 <script>

function readFile(selectedFile){

  return new Promise((resolve,reject)=>{

    if(!selectedFile){
      resolve(null);
      return;
    }

    const reader =
      new FileReader();

    reader.onload = () =>
      resolve(reader.result);

    reader.onerror = () =>
      reject(
        new Error("File could not be read.")
      );

    reader.readAsDataURL(
      selectedFile
    );

  });

}


function setFile(selectedFile){

  if(!selectedFile)
    return;

  file = selectedFile;

  $("fileName").textContent =
    selectedFile.name;

  $("filePreview")
    .classList.add("show");

  $("tools")
    .classList.remove("show");

  updateSendButton();

}


function removeFile(){

  file = null;

  $("fileName").textContent = "";

  $("filePreview")
    .classList.remove("show");

  if($("cameraInput"))
    $("cameraInput").value = "";

  if($("galleryInput"))
    $("galleryInput").value = "";

  if($("fileInput"))
    $("fileInput").value = "";

  updateSendButton();

}


$("removeFile").onclick =
  removeFile;


$("plusBtn").onclick = event => {

  event.stopPropagation();

  $("tools")
    .classList.toggle("show");

};


document.addEventListener(
  "click",
  event => {

    if(
      !$("tools").contains(event.target) &&
      event.target !== $("plusBtn")
    ){

      $("tools")
        .classList.remove("show");

    }

  }
);


$("cameraBtn").onclick = () => {

  $("cameraInput").click();

};


$("galleryBtn").onclick = () => {

  $("galleryInput").click();

};


$("fileBtn").onclick = () => {

  $("fileInput").accept =
    ".txt,.csv,.json,.doc,.docx,.pdf";

  $("fileInput").click();

};


$("pdfBtn").onclick = () => {

  $("fileInput").accept =
    "application/pdf,.pdf";

  $("fileInput").click();

};


$("cameraInput").onchange =
  event => {

    const selected =
      event.target.files?.[0];

    setFile(selected);

  };


$("galleryInput").onchange =
  event => {

    const selected =
      event.target.files?.[0];

    setFile(selected);

  };


$("fileInput").onchange =
  event => {

    const selected =
      event.target.files?.[0];

 <script>

let recognition = null;
let listening = false;

function setupVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    $("status").textContent =
      "● Voice not supported";

    return false;
  }

  recognition =
    new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.lang =
    language === "auto"
      ? "hi-IN"
      : language === "English"
        ? "en-IN"
        : language === "Hindi"
          ? "hi-IN"
          : "en-IN";

  recognition.onstart = () => {

    listening = true;

    $("status").textContent =
      "● Listening…";

    $("micBtn").title =
      "Stop listening";

  };

  recognition.onresult = event => {

    let finalText = "";
    let interimText = "";

    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      const transcript =
        event.results[i][0]
          .transcript;

      if(event.results[i].isFinal){

        finalText += transcript;

      }else{

        interimText += transcript;

      }

    }

    if(finalText){

      const current =
        $("input").value.trim();

      $("input").value =
        current
          ? current + " " + finalText
          : finalText;

      $("input").dispatchEvent(
        new Event("input")
      );

    }

  };

  recognition.onerror = event => {

    console.warn(
      "Voice error:",
      event.error
    );

    listening = false;

    $("status").textContent =
      "● AI ready";

    $("micBtn").title =
      "Voice input";

  };

  recognition.onend = () => {

    listening = false;

    $("status").textContent =
      "● AI ready";

    $("micBtn").title =
      "Voice input";

  };

  return true;
}


$("micBtn").onclick = () => {

  if(!recognition){

    if(!setupVoice())
      return;

  }

  if(listening){

    recognition.stop();

    return;

  }

  try{

    recognition.lang =
      language === "auto"
        ? "hi-IN"
        : language === "English"
          ? "en-IN"
          : language === "Hindi"
            ? "hi-IN"
            : "en-IN";

    recognition.start();

  }catch(error){

    console.warn(
      "Voice start error:",
      error
    );

  }

};

 </script>

 <script>

let imageGenerating = false;

$("imageBtn").onclick = () => {

  $("tools")
    .classList.remove("show");

  openModal(
    "✨ Create Image",
    `
    <div class="option">
      <b>AI Image Generator</b>
      <small>
        Describe the image you want SMATER CHAT AI
        to create.
      </small>
    </div>

    <div class="field">
      <label>Image prompt</label>

      <textarea
        id="imagePrompt"
        style="
          width:100%;
          min-height:110px;
          resize:vertical;
          padding:10px;
          background:var(--panel);
          border:1px solid var(--line);
          border-radius:10px;
          outline:0;
        "
        placeholder="Example: Create a beautiful sunset over Mumbai with a cinematic atmosphere."
      ></textarea>
    </div>

    <div class="field">
      <label>Optional reference image</label>

      <input
        id="imageReference"
        type="file"
        accept="image/*"
      >
    </div>

    <button
      class="primary"
      id="generateImageBtn"
    >
      Generate Image
    </button>
    `
  );


  $("generateImageBtn").onclick =
    generateImage;

};


async function generateImage(){

  if(imageGenerating) return;

  const prompt =
    $("imagePrompt")
      ?.value
      .trim();

  if(!prompt){

    alert(
      "Please describe the image you want."
    );

    return;

  }

  imageGenerating = true;

  $("generateImageBtn").disabled =
    true;

  $("generateImageBtn").textContent =
    "Generating…";

  $("status").textContent =
    "● Creating image…";

  try{

    let reference = null;

    const referenceFile =
      $("imageReference")
        ?.files?.[0];

    if(referenceFile){

      reference =
        await readFile(referenceFile);

    }

    closeModal();

    addMessage(
      "user",
      "Create an image:\n" + prompt
    );

    const loading =
      document.createElement("div");

    loading.className =
      "message assistant";

    loading.innerHTML = `
      <div class="avatar">S</div>
      <div class="messageWrap">
        <div class="bubble">
          Creating your image…
        </div>
      </div>
    `;

    $("chatInner")
      .appendChild(loading);

    scrollChat();


    const response =
      await fetch(
        "/api/image",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            prompt:prompt,
            referenceImage:reference
          })
        }
      );


    let data = {};

    try{

      data =
        await response.json();

    }catch(e){

      data = {};

    }


    loading.remove();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Image generation failed."
      );

    }


    if(!data.image){

      throw new Error(
        "No image was returned."
      );

    }


    addGeneratedImage(
      data.image
    );


  }catch(error){

    console.error(error);

    addMessage(
      "assistant",
      "I couldn't generate the image right now. Please try again."
    );

  }finally{

    imageGenerating = false;

    $("status").textContent =
      "● AI ready";

    updateSendButton();

  }

}


function addGeneratedImage(image){

  const welcome =
    $("welcome");

  if(welcome)
    welcome.remove();


  const row =
    document.createElement("div");

  row.className =
    "message assistant";


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    "S";


  const wrap =
    document.createElement("div");

  wrap.className =
    "messageWrap";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  const img =
    document.createElement("img");

  img.src = image;

  img.alt =
    "Generated by SMATER CHAT AI";

  img.style.width =
    "100%";

  img.style.maxWidth =
    "520px";

  img.style.display =
    "block";

  img.style.borderRadius =
    "12px";


  const actions =
    document.createElement("div");

  actions.className =
    "messageActions";


  const saveBtn =
    document.createElement("button");

  saveBtn.className =
    "actionBtn";

  saveBtn.textContent =
    "Save image";


  saveBtn.onclick = () => {

    const link =
      document.createElement("a");

    link.href = image;

    link.download =
      "smater-chat-ai-image.png";

    document.body.appendChild(link);

    link.click();

    link.remove();

  };


  bubble.appendChild(img);

  actions.appendChild(saveBtn);

  wrap.appendChild(bubble);

  wrap.appendChild(actions);

  row.appendChild(avatar);

  row.appendChild(wrap);

  $("chatInner")
    .appendChild(row);

  scrollChat();

}

 </script>
 <script>

function addImageActions(container,image){

  const actions =
    document.createElement("div");

  actions.className =
    "messageActions";

  const copy =
    document.createElement("button");

  copy.className =
    "actionBtn";

  copy.textContent =
    "Copy image";

  copy.onclick = async () => {

    try{

      const response =
        await fetch(image);

      const blob =
        await response.blob();

      await navigator.clipboard.write([
        new ClipboardItem({
          [blob.type]: blob
        })
      ]);

      copy.textContent =
        "Copied ✓";

      setTimeout(() => {
        copy.textContent =
          "Copy image";
      },1200);

    }catch(e){

      alert(
        "Image copying is not supported here. Use Save image."
      );

    }

  };


  const share =
    document.createElement("button");

  share.className =
    "actionBtn";

  share.textContent =
    "Share";

  share.onclick = async () => {

    try{

      if(!navigator.share){

        alert(
          "Sharing is not supported on this browser."
        );

        return;

async function createFile(){

    return;

  const prompt =

  const type =
    $("createFileType")
      ?.value || "pdf";

  }


  fileCreating = true;

    true;

  $("createFileBtn").textContent =

  $("status").textContent =
    "● Creating file…";


  try{

    closeModal();

    addMessage(
      "user",

      type.toUpperCase() +
      ":\n" +
      prompt
    );


    const loading =
      document.createElement("div");

      "message assistant";

            type:type,

            language:language

          })

        }

    let data = {};

    try{

      data =
        await response.json();

    }catch(e){

      );

      data.filename ||
        "smater-chat-ai-file"
    );

    console.error(error);

    addMessage(
      "assistant",
      "I couldn't create that file right now. Please try again."

 <script>

function getAIText(data){

  if(!data) return "";

  if(typeof data.text === "string"){
    return data.text.trim();
  }

  if(typeof data.answer === "string"){
    return data.answer.trim();
  }

  if(typeof data.response === "string"){
    return data.response.trim();
  }

  if(
    data.choices &&
    Array.isArray(data.choices) &&
    data.choices[0]
  ){

    const choice =
      data.choices[0];

    if(
      choice.message &&
      typeof choice.message.content === "string"
    ){
      return choice.message.content.trim();
    }

    if(typeof choice.text === "string"){
      return choice.text.trim();
    }

  }

  return "";
}


function showAIError(message){

  const safe =
    message ||
    "Something went wrong. Please try again.";

  addMessage(
    "assistant",
    safe
  );

}


async function requestAI(payload){

  const response =
    await fetch(
      "/api/chat",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify(payload)
      }
    );


  let data = {};

  try{

    data =
      await response.json();

  }catch(error){

    throw new Error(
      "The server returned an invalid response."
    );

  }


  if(!response.ok){

    throw new Error(
      data.error ||
      "AI request failed."
    );

  }


  const text =
    getAIText(data);

  if(!text){

    throw new Error(
      "The AI returned an empty response."
    );

  }


  return text;

}


function setStatus(text){

  if($("status")){
    $("status").textContent =
      "● " + text;
  }

}

<script>
async function connectFileAPI(prompt, type = "txt") {
  try {
    const response = await fetch("/api/file", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt,
        type: type
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "File service failed.");
    }

    if (data.file) {
      const link = document.createElement("a");
      link.href = data.file;
      link.download = data.filename || "smater-chat-ai-file";
      document.body.appendChild(link);
      link.click();
      link.remove();
      return true;
    }

    throw new Error("No file was returned.");

  } catch (error) {
    console.error("File connection error:", error);
    alert("File could not be created right now.");
    return false;
  }
}
