<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>SMATER CHAT AI</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#080d18;
--panel:#101827;
--panel2:#172236;
--text:#f5f7fb;
--muted:#93a0b5;
--line:#293852;
--accent:#6878ff;
--user:#203c68;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:system-ui,
-apple-system,BlinkMacSystemFont,
"Segoe UI",sans-serif;
}

button,input,textarea,select{
font:inherit;
color:inherit;
}

button{cursor:pointer}

.app{
height:100vh;
height:100dvh;
display:flex;
overflow:hidden;
}

.sidebar{
width:270px;
background:var(--panel);
border-right:1px solid var(--line);
padding:15px;
display:flex;
flex-direction:column;
gap:8px;
}

.brand{
padding:8px 5px 16px;
}

.brand b{
font-size:18px;
}

.brand small{
display:block;
color:var(--muted);
font-size:11px;
margin-top:5px;
line-height:1.4;
}

.sideBtn{
width:100%;
padding:11px;
border-radius:12px;
border:1px solid var(--line);
background:var(--panel2);
text-align:left;
}

.newChat{
background:var(--accent);
border:0;
text-align:center;
font-weight:700;
}

.historyTitle{
color:var(--muted);
font-size:11px;
margin:10px 3px 3px;
}

.history{
flex:1;
overflow:auto;
}

.historyItem{
padding:10px;
border-radius:10px;
font-size:13px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.historyItem:hover{
background:var(--panel2);
}
 .topbar{
height:62px;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
gap:12px;
padding:0 16px;
}

.menuBtn{
display:none;
border:0;
background:transparent;
font-size:22px;
}

.title{
font-weight:800;
}

.status{
color:var(--muted);
font-size:11px;
margin-top:3px;
}

.main{
flex:1;
min-width:0;
display:flex;
flex-direction:column;
position:relative;
}

.chat{
flex:1;
overflow:auto;
}

.chatInner{
max-width:920px;
margin:auto;
padding:30px 16px 155px;
}

.welcome{
text-align:center;
padding:45px 8px;
}

.logo{
width:55px;
height:55px;
margin:auto;
border-radius:17px;
background:var(--accent);
display:grid;
place-items:center;
font-size:23px;
font-weight:900;
}

.welcome h1{
font-size:29px;
margin:18px 0 8px;
}

.welcome p{
color:var(--muted);
max-width:650px;
margin:auto;
line-height:1.5;
}

.cards{
max-width:660px;
margin:28px auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.card{
border:1px solid var(--line);
background:var(--panel);
border-radius:15px;
padding:15px;
text-align:left;
}

.card b{
display:block;
margin-bottom:5px;
}

.card small{
color:var(--muted);
line-height:1.4;
}

.message{
display:flex;
gap:10px;
margin:18px 0;
}

.message.user{
justify-content:flex-end;
}

.avatar{
width:35px;
height:35px;
flex:0 0 35px;
border-radius:11px;
background:var(--panel2);
display:grid;
place-items:center;
font-size:11px;
font-weight:800;
}

.user .avatar{
order:2;
background:var(--user);
}

.messageWrap{
max-width:84%;
}

.bubble{
background:var(--panel);
border:1px solid var(--line);
border-radius:15px;
padding:12px 14px;
line-height:1.6;
white-space:pre-wrap;
word-break:break-word;
font-size:16px;
}

.user .bubble{
background:var(--user);
border-color:#2c4d7d;
}

.messageActions{
margin-top:5px;
}

.actionBtn{
border:0;
background:transparent;
color:var(--muted);
font-size:11px;
padding:3px 6px;
}
 .composerArea{
position:absolute;
left:0;
right:0;
bottom:0;
padding:10px 12px 12px;
background:linear-gradient(
to top,var(--bg) 70%,transparent
);
}

.filePreview{
max-width:920px;
margin:0 auto 6px;
padding:8px 10px;
border:1px solid var(--line);
border-radius:11px;
background:var(--panel);
display:none;
justify-content:space-between;
font-size:12px;
}

.filePreview.show{
display:flex;
}

.composer{
max-width:920px;
margin:auto;
padding:7px;
display:flex;
align-items:flex-end;
gap:5px;
background:var(--panel);
border:1px solid var(--line);
border-radius:17px;
position:relative;
}

#input{
flex:1;
min-width:0;
min-height:44px;
max-height:150px;
resize:none;
border:0;
outline:0;
background:transparent;
padding:11px 5px;
font-size:16px;
}

.iconBtn,
.sendBtn{
width:42px;
height:42px;
min-width:42px;
border:0;
border-radius:12px;
background:transparent;
display:grid;
place-items:center;
}

.iconBtn:hover{
background:var(--panel2);
}

.sendBtn{
background:var(--accent);
font-size:22px;
font-weight:800;
}

.sendBtn:disabled{
opacity:.45;
cursor:not-allowed;
}

.iconBtn svg,
.tool svg{
width:20px;
height:20px;
fill:none;
stroke:currentColor;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round;
}

.tools{
position:absolute;
left:4px;
bottom:58px;
width:285px;
background:var(--panel);
border:1px solid var(--line);
border-radius:16px;
padding:7px;
display:none;
grid-template-columns:1fr 1fr;
gap:5px;
box-shadow:0 20px 55px #0008;
}

.tools.show{
display:grid;
}

.tool{
border:0;
background:transparent;
border-radius:11px;
padding:11px 8px;
text-align:left;
}

.tool:hover{
background:var(--panel2);
}

.tool b{
font-size:13px;
}

.tool small{
display:block;
color:var(--muted);
font-size:10px;
margin-top:3px;
}
 .modal{
position:fixed;
inset:0;
background:#0009;
display:none;
place-items:center;
padding:18px;
z-index:100;
}

.modal.show{
display:grid;
}

.modalBox{
width:min(480px,100%);
max-height:88vh;
overflow:auto;
background:var(--panel);
border:1px solid var(--line);
border-radius:18px;
padding:18px;
}

.modalHead{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.closeBtn{
border:0;
background:transparent;
font-size:23px;
}

.option{
background:var(--panel2);
border-radius:12px;
padding:13px;
margin:8px 0;
}

.option small{
display:block;
color:var(--muted);
margin-top:4px;
}

.primary{
width:100%;
border:0;
border-radius:10px;
background:var(--accent);
padding:11px;
font-weight:700;
}

.field{
margin:10px 0;
}

.field label{
display:block;
color:var(--muted);
font-size:12px;
margin-bottom:5px;
}

.field input,
.field select{
width:100%;
padding:10px;
background:var(--panel);
border:1px solid var(--line);
border-radius:9px;
outline:0;
}

@media(max-width:760px){

.sidebar{
position:fixed;
z-index:90;
left:0;
top:0;
bottom:0;
transform:translateX(-105%);
transition:.2s;
}

.sidebar.open{
transform:translateX(0);
}

.menuBtn{
display:block;
}

.cards{
grid-template-columns:1fr;
}

.welcome h1{
font-size:24px;
}

.messageWrap{
max-width:87%;
}

.bubble{
font-size:16px;
}
}
 </style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="brand">
<b>SMATER CHAT AI</b>
<small>
Think smarter. Ask anything. Get more done.
</small>
</div>

<button class="sideBtn newChat" id="newChat">
＋ New Chat
</button>

<div class="historyTitle">
RECENT CHATS
</div>

<div class="history" id="history"></div>

<button class="sideBtn" id="accountBtn">
◎ Account
</button>

<button class="sideBtn" id="settingsBtn">
⚙ Settings
</button>

<button class="sideBtn" id="storageBtn">
▣ Storage & Data
</button>

<button class="sideBtn" id="privacyBtn">
◇ Privacy & Security
</button>

<button class="sideBtn" id="shareBtn">
↗ Share / Export
</button>

<button class="sideBtn" id="clearBtn">
⌫ Clear History
</button>

</aside>

<main class="main">

<header class="topbar">

<button class="menuBtn" id="menuBtn">
☰
</button>

<div>
<div class="title">
SMATER CHAT AI
</div>

<div class="status" id="status">
● AI ready
</div>

</div>

</header>

<section class="chat" id="chat">

<div class="chatInner" id="chatInner">

<div class="welcome" id="welcome">

<div class="logo">S</div>

<h1>
How can I help you?
</h1>

<p>
Ask anything in Hindi, English,
Hinglish or another language.
</p>

<div class="cards">

<button class="card"
data-prompt="Explain artificial intelligence in simple words.">

<b>Learn</b>

<small>
Understand any topic clearly.
</small>

</button>

<button class="card"
data-prompt="Help me solve this problem step by step.">

<b>Solve</b>

<small>
Work through a problem carefully.
</small>

</button>

<button class="card"
data-prompt="Give me useful ideas for my project.">

<b>Ideas</b>

<small>
Brainstorm practical options.
</small>

</button>

<button class="card"
data-prompt="Write a professional message for me.">

<b>Write</b>

<small>
Create clear, polished content.
</small>

</button>

</div>

</div>

</div>

</section>
<div class="composerArea">

<div class="filePreview" id="filePreview">
<span id="fileName"></span>
<button class="closeBtn" id="removeFile">×</button>
</div>

<div class="composer">

<button class="iconBtn" id="plusBtn">
<svg viewBox="0 0 24 24">
<path d="M12 5v14M5 12h14"/>
</svg>
</button>

<textarea
id="input"
rows="1"
placeholder="Message SMATER CHAT AI..."
></textarea>

<button class="iconBtn" id="micBtn">
<svg viewBox="0 0 24 24">
<rect x="9" y="3" width="6" height="12" rx="3"/>
<path d="M5 11a7 7 0 0 0 14 0"/>
<path d="M12 18v3M9 21h6"/>
</svg>
</button>

<button class="sendBtn" id="sendBtn">
↑
</button>

<div class="tools" id="tools">

<button class="tool" id="cameraBtn">
<svg viewBox="0 0 24 24">
<path d="M4 7h3l2-2h6l2 2h3v12H4z"/>
<circle cx="12" cy="13" r="3"/>
</svg>
<b> Camera</b>
<small>Take a photo</small>
</button>

<button class="tool" id="galleryBtn">
<svg viewBox="0 0 24 24">
<rect x="3" y="3" width="18" height="18" rx="2"/>
<circle cx="8" cy="8" r="1"/>
<path d="m3 16 5-5 4 4 3-3 6 6"/>
</svg>
<b> Gallery</b>
<small>Choose an image</small>
</button>

<button class="tool" id="fileBtn">
<svg viewBox="0 0 24 24">
<path d="M6 3h8l4 4v14H6z"/>
<path d="M14 3v5h5"/>
</svg>
<b> File</b>
<small>Attach a file</small>
</button>

<button class="tool" id="pdfBtn">
<svg viewBox="0 0 24 24">
<path d="M6 3h8l4 4v14H6z"/>
<path d="M14 3v5h5"/>
<path d="M8 15h8M8 18h6"/>
</svg>
<b> PDF</b>
<small>Attach PDF</small>
</button>

<button class="tool" id="modeBtn">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9"/>
<path d="M8 12h8M12 8v8"/>
</svg>
<b> @ Modes</b>
<small>Assistant modes</small>
</button>

<button class="tool" id="languageBtn">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9"/>
<path d="M3 12h18"/>
<path d="M12 3c3 3 3 15 0 18"/>
<path d="M12 3c-3 3-3 15 0 18"/>
</svg>
<b> Language</b>
<small>Select language</small>
</button>

</div>
</div>

<input
id="cameraInput"
type="file"
accept="image/*"
capture="environment"
hidden>

<input
id="galleryInput"
type="file"
accept="image/*"
hidden>

<input
id="fileInput"
type="file"
hidden>

</div>
<div class="modal" id="modal">

<div class="modalBox" id="modalBox">

<div class="modalHead">

<b id="modalTitle">
SMATER CHAT AI
</b>

<button
class="closeBtn"
id="closeModal">
×
</button>

</div>

<div id="modalContent"></div>

</div>
</div>
<script>
const $=id=>document.getElementById(id);

let messages=[];
let file=null;
let sending=false;
let language="auto";
let mode="normal";
let recognition=null;
let listening=false;

const KEY="smater_chat_history";

function save(){
 localStorage.setItem(KEY,JSON.stringify(messages));
}

function scroll(){
 setTimeout(()=>{
  $("chat").scrollTop=$("chat").scrollHeight;
 },30);
}

function addMessage(role,text,saveIt=true){

 if($("welcome"))$("welcome").remove();

 const row=document.createElement("div");
 row.className="message "+role;

 const avatar=document.createElement("div");
 avatar.className="avatar";
 avatar.textContent=role==="user"?"YOU":"S";

 const wrap=document.createElement("div");
 wrap.className="messageWrap";

 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent=text;

 wrap.appendChild(bubble);

 if(role==="assistant"){

  const actions=document.createElement("div");
  actions.className="messageActions";

  const copy=document.createElement("button");
  copy.className="actionBtn";
  copy.textContent="Copy";

  copy.onclick=()=>{
   navigator.clipboard.writeText(text);
   copy.textContent="Copied";
   setTimeout(()=>copy.textContent="Copy",1200);
  };

  actions.appendChild(copy);
  wrap.appendChild(actions);
 }

 row.appendChild(avatar);
 row.appendChild(wrap);

 $("chatInner").appendChild(row);

 if(saveIt){
  messages.push({role,content:text});
  save();
  updateHistory();
 }

 scroll();
}

function updateHistory(){

 const h=$("history");
 h.innerHTML="";

 const first=messages.find(x=>x.role==="user");

 if(!first){
  h.innerHTML=
  '<div style="color:var(--muted);padding:10px;font-size:12px">No chats yet</div>';
  return;
 }

 const item=document.createElement("div");
 item.className="historyItem";
 item.textContent=first.content.slice(0,55);

 h.appendChild(item);
}

function loadHistory(){

 try{
  messages=JSON.parse(localStorage.getItem(KEY))||[];
 }catch(e){
  messages=[];
 }

 if(messages.length){

  $("welcome").remove();

  messages.forEach(x=>{
   addMessage(x.role,x.content,false);
  });
 }

 updateHistory();
}

function updateSend(){

 $("sendBtn").disabled=
 sending ||
 (!$("input").value.trim() && !file);
}

async function readFile(f){

 return new Promise((resolve,reject)=>{

  const r=new FileReader();

  r.onload=()=>resolve(r.result);
  r.onerror=reject;

  r.readAsDataURL(f);
 });
}

function setFile(f){

 if(!f)return;

 file=f;

 $("fileName").textContent=f.name;
 $("filePreview").classList.add("show");
 $("tools").classList.remove("show");

 updateSend();
}

function removeFile(){

 file=null;

 $("fileName").textContent="";
 $("filePreview").classList.remove("show");

 $("cameraInput").value="";
 $("galleryInput").value="";
 $("fileInput").value="";

 updateSend();
}
 async function sendMessage(){

 if(sending)return;

 const text=$("input").value.trim();

 if(!text&&!file)return;

 sending=true;
 updateSend();

 $("status").textContent="● Thinking…";

 let attachment=null;

 if(file){
  attachment={
   name:file.name,
   type:file.type,
   data:await readFile(file)
  };
 }

 addMessage(
  "user",
  text+(attachment?
  "\n\n[Attached: "+attachment.name+"]":"")
 );

 $("input").value="";
 $("input").style.height="44px";

 const loading=document.createElement("div");

 loading.className="message assistant";

 loading.innerHTML=
 '<div class="avatar">S</div>'+
 '<div class="messageWrap">'+
 '<div class="bubble">Thinking…</div>'+
 '</div>';

 $("chatInner").appendChild(loading);

 scroll();

 try{

  const response=await fetch(
   "/api/chat",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     messages,
     language,
     mode,
     file:attachment
    })
   }
  );

  const data=await response.json();

  if(!response.ok){
   throw new Error(
    data.error||"Request failed"
   );
  }

  loading.remove();

  addMessage(
   "assistant",
   data.text||"No answer received."
  );

 }catch(error){

  console.error(error);

  loading.remove();

  addMessage(
   "assistant",
   "Sorry, I couldn't complete that request. Please try again."
  );

 }finally{

  sending=false;

  removeFile();

  $("status").textContent="● AI ready";

  updateSend();
 }
}

$("sendBtn").onclick=sendMessage;

$("input").oninput=()=>{

 $("input").style.height="44px";

 $("input").style.height=
 Math.min(
  $("input").scrollHeight,
  150
 )+"px";

 updateSend();
};

$("input").onkeydown=e=>{

 if(e.key==="Enter"&&!e.shiftKey){

  e.preventDefault();

  sendMessage();
 }
};
 $("plusBtn").onclick=e=>{
 e.stopPropagation();
 $("tools").classList.toggle("show");
};

document.onclick=e=>{
 if(
  !$("tools").contains(e.target)&&
  e.target!==$("plusBtn")
 ){
  $("tools").classList.remove("show");
 }
};

$("cameraBtn").onclick=()=>{
 $("cameraInput").click();
};

$("galleryBtn").onclick=()=>{
 $("galleryInput").click();
};

$("fileBtn").onclick=()=>{
 $("fileInput").accept="*/*";
 $("fileInput").click();
};

$("pdfBtn").onclick=()=>{
 $("fileInput").accept="application/pdf,.pdf";
 $("fileInput").click();
};

$("cameraInput").onchange=e=>{
 setFile(e.target.files[0]);
};

$("galleryInput").onchange=e=>{
 setFile(e.target.files[0]);
};

$("fileInput").onchange=e=>{
 setFile(e.target.files[0]);
};

$("removeFile").onclick=removeFile;


/* NEW CHAT */

$("newChat").onclick=()=>{

 messages=[];
 save();

 $("chatInner").innerHTML=
 '<div class="welcome" id="welcome">'+
 '<div class="logo">S</div>'+
 '<h1>How can I help you?</h1>'+
 '<p>Ask anything in Hindi, English, Hinglish or another language.</p>'+
 '</div>';

 updateHistory();

 $("sidebar").classList.remove("open");

 $("input").focus();
};


/* MOBILE MENU */

$("menuBtn").onclick=()=>{
 $("sidebar").classList.toggle("open");
};


/* SUGGESTIONS */

document.querySelectorAll("[data-prompt]").forEach(btn=>{

 btn.onclick=()=>{

  $("input").value=btn.dataset.prompt;

  $("input").dispatchEvent(
   new Event("input")
  );

  $("input").focus();
 };
});


/* REMOVE FILE */

$("filePreview").onclick=e=>{
 if(e.target.id==="removeFile"){
  removeFile();
 }
};
 $("micBtn").onclick=()=>{

 if(!recognition){
  setupVoice();
 }

 if(!recognition)return;

 if(listening){
  recognition.stop();
 }else{
  try{
   recognition.start();
  }catch(e){}
 }
};


function setupVoice(){

 const Speech=
 window.SpeechRecognition||
 window.webkitSpeechRecognition;

 if(!Speech){
  $("status").textContent=
  "● Voice not supported";
  return;
 }

 recognition=new Speech();

 recognition.continuous=false;
 recognition.interimResults=false;

 recognition.lang=
 language==="en"?
 "en-IN":"hi-IN";


 recognition.onstart=()=>{

  listening=true;

  $("status").textContent=
  "● Listening…";
 };


 recognition.onresult=e=>{

  const text=
  e.results[0][0].transcript;

  $("input").value+=
  ($("input").value?" ":"")+
  text;

  $("input").dispatchEvent(
   new Event("input")
  );
 };


 recognition.onerror=()=>{

  listening=false;

  $("status").textContent=
  "● AI ready";
 };


 recognition.onend=()=>{

  listening=false;

  $("status").textContent=
  "● AI ready";
 };
}


/* LOAD SAVED CHAT */

loadHistory();

updateSend();

</script>

</body>
</html>
